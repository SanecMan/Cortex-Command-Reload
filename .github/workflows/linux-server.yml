name: Linux Dedicated Server

on:
  push:
    branches:
      - 'codex/linux-server-*'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: linux-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 cmake ninja-build pkg-config libflac-dev libminizip-dev liblz4-dev libpng-dev libtbb-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libasound2-dev libpulse-dev
          python -m pip install meson==1.12.1
      - name: Configure server-only target
        run: >-
          meson setup build-server --buildtype=release --wrap-mode=nodownload
          -Dbuild_client=false -Dbuild_server=true
          -Dinstall_runner=false -Dinstall_data=false
          -Dtracy_enable=false -Db_lto=false -Db_pch=false
      - name: Verify profiler flags
        run: python Tools/check_tracy_build.py --compile-commands build-server/compile_commands.json --expect disabled
      - name: Compile
        run: meson compile -C build-server -j 2
      - name: Verify Army loadouts and player admission
        run: |
          meson compile -C build-server ArmyAdmissionTest -j 2
          meson test -C build-server --no-rebuild army-admission
      - name: Verify screen text codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/WorldStateScreenTextTest.cpp -o build-server/world-state-screen-text-test
          build-server/world-state-screen-text-test
      - name: Verify objectives codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/WorldStateObjectivesTest.cpp -o build-server/objectives-test
          build-server/objectives-test
      - name: Verify construction request codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/WorldStateConstructionTest.cpp -o build-server/construction-test
          build-server/construction-test
      - name: Verify resident brain state codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/WorldStateConstructionStateTest.cpp -o build-server/construction-state-test
          build-server/construction-state-test
      - name: Verify scene load generations
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/SceneLoadGenerationTest.cpp -o build-server/scene-generation-test
          build-server/scene-generation-test
      - name: Verify peer identities
        run: |
          g++-13 -std=c++20 -Wall -Wextra -pthread -I external/sources/RakNet/include Tools/RakNetGuidTest.cpp -o build-server/peer-guid-test
          build-server/peer-guid-test
          python Tools/check_peer_guid_processes.py --exe build-server/peer-guid-test
      - name: Verify UTF-8 font and legacy HUD decoding
        run: |
          g++-13 -std=c++20 -Wall -Wextra Tools/FontGlyphDecodeTest.cpp -o build-server/font-glyph-test
          build-server/font-glyph-test
      - name: Verify UTF-8 line layout
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/FontLineLayoutTest.cpp -o build-server/font-line-layout-test
          build-server/font-line-layout-test
      - name: Verify device presentation codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/WorldStateDeviceVisualTest.cpp -o build-server/device-visual-test
          build-server/device-visual-test
      - name: Verify shot flash presentation timeline
        run: |
          g++-13 -std=c++20 -Wall -Wextra Tools/ShotFlashPresentationTest.cpp -o build-server/shot-flash-test
          build-server/shot-flash-test
      - name: Verify sound payload codec
        run: |
          g++-13 -std=c++20 -Wall -Wextra -pthread -I Source/System Tools/WorldStateSoundProtocolTest.cpp -o build-server/world-state-sound-test
          build-server/world-state-sound-test
      - name: Verify sound playback seeking
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/SoundPlaybackSeekTest.cpp -o build-server/sound-playback-seek-test
          build-server/sound-playback-seek-test
      - name: Verify sound fade arithmetic
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/SoundFadeMathTest.cpp -o build-server/sound-fade-math-test
          build-server/sound-fade-math-test
      - name: Verify sound fade envelopes
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I Source/System Tools/SoundFadeEnvelopeTest.cpp -o build-server/sound-fade-envelope-test
          build-server/sound-fade-envelope-test
      - name: Verify asynchronous sound resource shutdown
        run: |
          g++-13 -std=c++20 -Wall -Wextra -I external/include/fmod-2.2.13 Tools/FmodAsyncSoundShutdownTest.cpp external/lib/linux/x86_64/libfmod.so.13.20 -o build-server/fmod-async-shutdown-test
          cp external/lib/linux/x86_64/libfmod.so.13.20 build-server/libfmod.so.13
          LD_LIBRARY_PATH="$PWD/build-server${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" build-server/fmod-async-shutdown-test Data
      - name: Check dependencies
        run: |
          ldd build-server/CortexCommandServer | tee build-server/runtime-dependencies.txt
          if grep -q 'not found' build-server/runtime-dependencies.txt; then exit 1; fi
      - name: Run without display or audio drivers
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer
          --game-dir . --output-prefix LinuxDedicatedCI --timeout 300 --self-test --probe-clients --screen-text --objectives
      - name: Verify two active players and repeated input silence
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer
          --game-dir . --output-prefix LinuxBrainVsBrainCI --timeout 300
          --probe-clients --probe-seconds 15 --input-silence
          --activity-class GAScripted --activity "Brain vs Brain"
          --scene "Fredeleig Bunkers" --require-players 2
      - name: Verify connected roster restart and distinct controlled actors
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer
          --game-dir . --output-prefix LinuxRosterRestartCI --timeout 300
          --probe-clients --probe-seconds 30 --input-silence --restart-with-clients --restart-count 3 --require-control
          --activity-class GAScripted --activity "Bunker Breach"
          --scene "Zekarra Mining Outpost" --require-players 2
      - name: Verify disconnected and empty rosters
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer
          --game-dir . --output-prefix LinuxDisconnectedRosterCI --timeout 300
          --probe-clients --probe-seconds 15 --restart-with-clients --disconnect-one-restart
          --check-deferred-restart --require-control --require-players 2
          --activity-class GAScripted --activity "Bunker Breach" --scene "Zekarra Mining Outpost"
      - name: Verify admission to a running match
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer
          --game-dir . --output-prefix LinuxLatePlayerCI --timeout 300
          --probe-clients --probe-seconds 12 --second-client-delay 3 --require-control --require-players 2
          --activity-class GAScripted --activity "Bunker Breach" --scene "Zekarra Mining Outpost"
      - name: Verify construction command boundaries
        run: |
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer --game-dir . --output-prefix LinuxConstructionPhaseCI --timeout 300 --probe-clients --construction-check --require-players 2 --activity-class GAScripted --activity "Bunker Breach" --scene "Zekarra Mining Outpost"
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer --game-dir . --output-prefix LinuxConstructionEditingCI --timeout 300 --probe-clients --construction-check --require-players 2 --activity-class GAScripted --activity "Skirmish Defense" --scene "Ketanot Hills"
      - name: Verify native brain placement and match start
        run: >-
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer --game-dir .
          --output-prefix LinuxBrainConstructionCI --timeout 300 --probe-clients --brain-start
          --activity-class GAScripted --activity "Skirmish Defense" --scene "Ketanot Hills"
      - name: Verify late Army participants
        run: |
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer --game-dir . --output-prefix LinuxArmyLateCI --timeout 300 --probe-clients --probe-seconds 12 --second-client-delay 3 --require-control --require-players 2 --activity-class GAScripted --activity "One-Man Army" --scene "Ketanot Hills"
          python Tools/run_server_smoke.py --exe build-server/CortexCommandServer --game-dir . --output-prefix LinuxArmyDiggersLateCI --timeout 300 --probe-clients --probe-seconds 12 --second-client-delay 3 --require-control --require-players 2 --activity-class GAScripted --activity "One-Man Army (Diggers Only)" --scene "Fredeleig Plains"
      - name: Package server
        run: |
          mkdir -p build-server/package
          cp build-server/CortexCommandServer Server.example.ini build-server/package/
          cp external/lib/linux/x86_64/libfmod.so.13.20 build-server/package/
          ln -s libfmod.so.13.20 build-server/package/libfmod.so.13
          cp Documentation/DedicatedServer.md build-server/package/
          tar -C build-server/package -czf build-server/CortexCommandServer-linux-x64.tar.gz .
      - name: Verify extracted server package
        run: |
          package_check="$RUNNER_TEMP/cortex-server-package-check"
          mkdir -p "$package_check"
          tar -C "$package_check" -xzf build-server/CortexCommandServer-linux-x64.tar.gz
          ldd "$package_check/CortexCommandServer" | tee build-server/package-runtime-dependencies.txt
          if grep -q 'not found' build-server/package-runtime-dependencies.txt; then exit 1; fi
          python Tools/run_server_smoke.py --exe "$package_check/CortexCommandServer" --game-dir . --output-prefix LinuxPackagedCI --timeout 300 --probe-clients --screen-text
      - name: Collect runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-diagnostics
          path: |
            ScreenShots/LinuxDedicatedCI/
            ScreenShots/LinuxDedicatedCISelfTest/
            ScreenShots/LinuxPackagedCI/
            ScreenShots/LinuxBrainVsBrainCI/
            ScreenShots/LinuxRosterRestartCI/
            ScreenShots/LinuxDisconnectedRosterCI/
            ScreenShots/LinuxLatePlayerCI/
            ScreenShots/LinuxConstructionPhaseCI/
            ScreenShots/LinuxConstructionEditingCI/
            ScreenShots/LinuxBrainConstructionCI/
            ScreenShots/LinuxArmyLateCI/
            ScreenShots/LinuxArmyDiggersLateCI/
            build-server/meson-logs/
            build-server/runtime-dependencies.txt
            build-server/package-runtime-dependencies.txt
          if-no-files-found: warn
      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: CortexCommandServer-linux-x64
          path: build-server/CortexCommandServer-linux-x64.tar.gz
          if-no-files-found: error
